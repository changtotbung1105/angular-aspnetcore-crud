<div class="container mt-4" style="max-width: 500px;">
  <h2 class="mb-4">{{ isEdit ? 'Sửa sản phẩm' : 'Thêm sản phẩm' }}</h2>

  <!-- Spinner khi đang tải dữ liệu để sửa -->
  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Đang tải...</span>
    </div>
  </div>

  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()">
<div class="mb-3">
  <label class="form-label">Tên sản phẩm</label>
  <input
    formControlName="name"
    class="form-control"
    [class.is-invalid]="hasError('name', 'required') || hasError('name', 'minlength')"
    placeholder="Nhập tên sản phẩm"
  />
  <div class="invalid-feedback" *ngIf="hasError('name', 'required')">
    Tên sản phẩm không được để trống.
  </div>
  <div class="invalid-feedback" *ngIf="hasError('name', 'minlength')">
    Tên sản phẩm phải có ít nhất 2 ký tự.
  </div>
</div>

<div class="mb-3">
  <label class="form-label">Giá</label>
  <input
    formControlName="price"
    type="number"
    class="form-control"
    [class.is-invalid]="hasError('price', 'required') || hasError('price', 'min')"
    placeholder="0"
  />
  <div class="invalid-feedback" *ngIf="hasError('price', 'required')">
    Vui lòng nhập giá.
  </div>
  <div class="invalid-feedback" *ngIf="hasError('price', 'min')">
    Giá phải lớn hơn 0.
  </div>
</div>

<div class="mb-3">
  <label class="form-label">Số lượng</label>
  <input
    formControlName="quantity"
    type="number"
    class="form-control"
    [class.is-invalid]="hasError('quantity', 'required') || hasError('quantity', 'min')"
    placeholder="0"
  />
  <div class="invalid-feedback" *ngIf="hasError('quantity', 'required')">
    Vui lòng nhập số lượng.
  </div>
  <div class="invalid-feedback" *ngIf="hasError('quantity', 'min')">
    Số lượng không được âm.
  </div>
</div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
        <span *ngIf="saving()" class="spinner-border spinner-border-sm me-1" role="status"></span>
        {{ saving() ? 'Đang lưu...' : 'Lưu' }}
      </button>
      <a routerLink="/products" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
  
</div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Danh sách sản phẩm</h2>
    <a routerLink="/products/new" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> Thêm mới
    </a>
  </div>

    <!-- Ô tìm kiếm -->
  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Tìm theo tên sản phẩm..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
    />
  </div>

  <!-- Spinner khi đang tải -->
  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Đang tải...</span>
    </div>
  </div>

  <!-- Bảng chỉ hiện khi KHÔNG loading -->
  <table *ngIf="!loading()" class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Tên</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th class="text-end">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of filteredProducts()">
        <td>{{ p.name }}</td>
        <td>{{ p.price | number }} đ</td>
        <td>{{ p.quantity }}</td>
        <td class="text-end">
          <a [routerLink]="['/products/edit', p.id]" class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-pencil"></i> Sửa
          </a>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(p.id!)">
            <i class="bi bi-trash"></i> Xóa
          </button>
        </td>
      </tr>
    </tbody>
  </table>
<nav *ngIf="!loading() && totalPages() > 1" class="d-flex justify-content-between align-items-center mt-3">
  <span class="text-muted">
    Trang {{ currentPage() }} / {{ totalPages() }} — Tổng {{ totalItems() }} sản phẩm
  </span>

  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button class="page-link" (click)="goToPage(1)">«</button>
    </li>
    <li class="page-item" [class.disabled]="currentPage() === 1">
      <button class="page-link" (click)="goToPage(currentPage() - 1)">Trước</button>
    </li>

    <li
      class="page-item"
      *ngFor="let page of pageNumbers()"
      [class.active]="currentPage() === page"
    >
      <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
    </li>

    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button class="page-link" (click)="goToPage(currentPage() + 1)">Sau</button>
    </li>
    <li class="page-item" [class.disabled]="currentPage() === totalPages()">
      <button class="page-link" (click)="goToPage(totalPages())">»</button>
    </li>
  </ul>
</nav>
  <div *ngIf="!loading() && products().length === 0" class="text-center text-muted py-5">
    Chưa có sản phẩm nào.
  </div>
</div>

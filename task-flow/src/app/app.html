<nav class="navbar navbar-expand bg-light px-3 mb-2">

  <div class="ms-auto d-flex align-items-center gap-2">

    @if (auth.isLoggedIn()) {

    } @else {
      <a routerLink="/login" class="btn btn-outline-primary btn-sm">Đăng nhập</a>
      <a routerLink="/register" class="btn btn-success btn-sm">Đăng ký</a>
    }
  </div>
</nav>
